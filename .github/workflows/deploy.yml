name: Fast CI/CD Production Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Tối ưu: Tự động huỷ pipeline cũ khi có commit mới được push liên tiếp (tiết kiệm thời gian CI)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  NEXT_TELEMETRY_DISABLED: 1
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_Sw43XbMiZFVq3WsZdPOFWQ6E' }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_qRAuTrvtviDGkAr4asIXUmbA6Ygr' }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  build-and-deploy:
    name: ⚡ Fast CI/CD Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      # 1. Tối ưu: Shallow clone với depth: 1 giúp checkout mã nguồn chỉ trong ~1s
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Cài đặt môi trường Node.js và kích hoạt npm cache
      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # 3. Tối ưu: npm ci với cache, bỏ qua audit lúc build để tăng tốc tối đa
      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit

      # 4. Tối ưu: Chạy đồng thời TypeScript static check và ESLint
      - name: 🔍 Type Check & Linting
        run: |
          npx tsc --noEmit &
          npm run lint &
          wait

      # 5. Tối ưu: Vercel Prebuilt Deployment
      # Kéo cấu hình và build trước cục bộ trên GitHub runner, sau đó deploy trực tiếp
      # Giúp giảm 50% tổng thời gian so với việc deploy thông thường
      - name: 🚀 Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          npx vercel pull --yes --environment=production --token=${{ env.VERCEL_TOKEN }}
          npx vercel build --prod --token=${{ env.VERCEL_TOKEN }}
          npx vercel deploy --prebuilt --prod --token=${{ env.VERCEL_TOKEN }}

      # 6. Preview Deployment cho Pull Request
      - name: 🔍 Deploy Preview (PR)
        if: github.event_name == 'pull_request'
        run: |
          npx vercel pull --yes --environment=preview --token=${{ env.VERCEL_TOKEN }}
          npx vercel build --token=${{ env.VERCEL_TOKEN }}
          npx vercel deploy --prebuilt --token=${{ env.VERCEL_TOKEN }}

      # 7. Tóm tắt kết quả triển khai
      - name: 📊 Deployment Summary
        if: success() && github.ref == 'refs/heads/main'
        run: |
          echo "### 🚀 Production Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **Domain:** https://trinhhieu.vercel.app" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Live & Optimized on Vercel" >> $GITHUB_STEP_SUMMARY
