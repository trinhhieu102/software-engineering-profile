name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20
  NEXT_TELEMETRY_DISABLED: 1
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_Sw43XbMiZFVq3WsZdPOFWQ6E' }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_KoID1hpLo5ncKQhDghKICNp3yQJo' }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  # ---------------------------------------------------------------------------
  # Phase 1: Parallel Quality Assurance & Security Gates
  # ---------------------------------------------------------------------------
  type-check:
    name: 🛡️ TypeScript Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Clean Dependencies
        run: npm ci

      - name: 🔍 Verify Type Safety
        run: npx tsc --noEmit

  lint-and-format:
    name: 🎨 Lint & Code Style
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Clean Dependencies
        run: npm ci

      - name: 🧹 Run ESLint
        run: npm run lint

  security-audit:
    name: 🔒 Security Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛡️ Scan Dependencies for High/Critical CVEs
        run: npm audit --audit-level=high --omit=dev || true

  # ---------------------------------------------------------------------------
  # Phase 2: Build & Production Compilation
  # ---------------------------------------------------------------------------
  build:
    name: 🏗️ Next.js Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: ⚡ Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**.[jt]s', 'src/**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: 📦 Install Clean Dependencies
        run: npm ci

      - name: 🚀 Compile Production Bundle
        run: npm run build

  # ---------------------------------------------------------------------------
  # Phase 3: Zero-Downtime Production Deployment
  # ---------------------------------------------------------------------------
  deploy:
    name: 🚀 Deploy to Vercel Production
    needs: [build, type-check, lint-and-format, security-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install Vercel CLI
        run: npm install -g vercel@latest

      - name: 📂 Pull Vercel Environment Configuration
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: ⚡ Deploy Production Release
        if: env.VERCEL_TOKEN != ''
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: 📊 Post Deployment Summary
        run: |
          echo "### 🚀 Production Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Domain:** [https://trinhhieu.vercel.app](https://trinhhieu.vercel.app)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Zero Downtime Production Live" >> $GITHUB_STEP_SUMMARY
